name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: git identity for the interop tests
        run: |
          git config --global user.name "minigit test"
          git config --global user.email "minigit@example.com"
          git config --global init.defaultBranch main
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build -o /tmp/minigit .
